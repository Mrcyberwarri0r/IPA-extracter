[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iph"
version = "1.0.0"
description = "Install and extract IPA files from jailbroken and non-jailbroken iOS devices."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mrcyberwarri0r" }]
keywords = ["ios", "ipa", "frida", "decrypt", "jailbreak", "mobile-security", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "frida>=16.0",
    "frida-tools>=12.0",
    "pymobiledevice3>=4.0",
]

[project.urls]
Homepage = "https://github.com/Mrcyberwarri0r/IPA-extracter"
Repository = "https://github.com/Mrcyberwarri0r/IPA-extracter"
Issues = "https://github.com/Mrcyberwarri0r/IPA-extracter/issues"

[project.scripts]
iph = "iph.cli:main"

[tool.setuptools]
packages = ["iph"]

[tool.setuptools.package-data]
iph = ["scripts/*.js"]
